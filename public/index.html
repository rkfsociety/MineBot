<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MineBot</title>
  <style>
    :root {
      --bg: #0d1117;
      --panel: #161b22;
      --border: #30363d;
      --text: #e6edf3;
      --muted: #8b949e;
      --accent: #3fb950;
      --warn: #d29922;
      --err: #f85149;
      --chat: #58a6ff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: ui-sans-serif, system-ui, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 0.85rem 1.25rem;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
    }
    .top-actions {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      align-items: center;
      justify-content: flex-end;
    }
    .top-actions button {
      padding: 0.4rem 0.75rem;
      border-radius: 8px;
      font-size: 0.8rem;
    }
    h1 {
      margin: 0;
      font-size: 1.15rem;
      font-weight: 600;
      letter-spacing: 0.02em;
    }
    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem 1rem;
      font-size: 0.8rem;
      color: var(--muted);
    }
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.2rem 0.55rem;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 600;
      border: 1px solid var(--border);
      background: var(--bg);
    }
    .pill.ok { color: var(--accent); border-color: rgba(63, 185, 80, 0.35); }
    .pill.wait { color: var(--warn); border-color: rgba(210, 153, 34, 0.35); }
    .pill.off { color: var(--muted); }
    main {
      flex: 1;
      display: grid;
      grid-template-rows: auto 1fr auto;
      min-height: 0;
      max-width: 960px;
      width: 100%;
      margin: 0 auto;
      padding: 1rem;
      gap: 1rem;
    }
    .panel {
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--panel);
      padding: 0.85rem;
    }
    .panel h2 {
      margin: 0 0 0.65rem;
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--text);
      letter-spacing: 0.01em;
    }
    .grid {
      display: grid;
      grid-template-columns: 1.2fr 0.7fr 1fr 1fr;
      gap: 0.6rem;
      align-items: end;
    }
    .field label {
      display: block;
      font-size: 0.75rem;
      color: var(--muted);
      margin: 0 0 0.25rem;
    }
    .field input, .field select {
      width: 100%;
      padding: 0.55rem 0.75rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 0.9rem;
    }
    .field.pass { position: relative; }
    .field.pass input { padding-right: 2.6rem; }
    .eye {
      position: absolute;
      right: 0.45rem;
      bottom: 0.45rem;
      width: 2.05rem;
      height: 2.05rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.03);
      color: var(--muted);
      font-weight: 800;
      cursor: pointer;
    }
    .eye:hover { background: rgba(255,255,255,0.06); }
    .field input:focus, .field select:focus {
      outline: none;
      border-color: var(--accent);
    }
    .actions {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin-top: 0.65rem;
      align-items: center;
      justify-content: space-between;
    }
    .actions .left {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      align-items: center;
    }
    .secondary {
      border-color: rgba(88, 166, 255, 0.45);
      background: rgba(88, 166, 255, 0.12);
      color: rgba(88, 166, 255, 0.95);
    }
    .success {
      border-color: rgba(63, 185, 80, 0.45);
      background: rgba(63, 185, 80, 0.12);
      color: rgba(63, 185, 80, 1);
    }
    .danger {
      border-color: rgba(248, 81, 73, 0.55);
      background: rgba(248, 81, 73, 0.12);
      color: rgba(248, 81, 73, 0.95);
    }
    .small {
      font-size: 0.75rem;
      color: var(--muted);
    }
    .log-wrap {
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--panel);
      min-height: 280px;
      /* важно: разрешаем flex-детям с overflow скроллиться */
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .log-head {
      padding: 0.5rem 0.75rem;
      font-size: 0.75rem;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
    }
    #log {
      flex: 1;
      min-height: 0; /* иначе блок будет раздувать страницу вместо скролла */
      margin: 0;
      padding: 0.65rem 0.75rem;
      overflow-y: auto;
      font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
      font-size: 0.8rem;
      line-height: 1.45;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .line { margin: 0 0 0.35rem; }
    .line.info { color: var(--text); }
    .line.warn { color: var(--warn); }
    .line.error { color: var(--err); }
    .line.chat { color: var(--chat); }
    .chat-bar {
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }
    .chat-bar input {
      flex: 1;
      padding: 0.55rem 0.75rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--text);
      font-size: 0.9rem;
    }
    .chat-bar input:focus {
      outline: none;
      border-color: var(--accent);
    }
    button {
      padding: 0.55rem 1rem;
      border-radius: 8px;
      border: 1px solid rgba(63, 185, 80, 0.45);
      background: rgba(63, 185, 80, 0.12);
      color: var(--accent);
      font-weight: 600;
      cursor: pointer;
      font-size: 0.85rem;
    }
    button:hover { background: rgba(63, 185, 80, 0.2); }
    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }
    .hint { font-size: 0.75rem; color: var(--muted); margin-top: 0.35rem; }
  </style>
</head>
<body>
  <header>
    <h1>MineBot <span id="appver" style="color: var(--muted); font-weight: 600; font-size: 0.85rem;"></span></h1>
    <div class="top-actions">
      <button type="button" id="topUpdate" class="secondary">Обновить</button>
      <button type="button" id="topDebug" class="secondary">Дебаг</button>
      <button type="button" id="topRepair" class="secondary">Починить</button>
      <button type="button" id="topRestartPanel" class="secondary">Перезапуск панели</button>
      <button type="button" id="topRestartBot" class="secondary">Перезапуск бота</button>
      <span id="pill" class="pill off">нет данных</span>
      <div class="meta" id="meta"></div>
    </div>
  </header>
  <main>
    <section class="panel">
      <h2>Подключение</h2>
      <form id="cfgform">
        <div class="grid">
          <div class="field">
            <label for="host">Сервер</label>
            <input id="host" type="text" autocomplete="off" placeholder="example.org или 127.0.0.1" />
          </div>
          <div class="field">
            <label for="port">Порт</label>
            <input id="port" type="number" min="1" max="65535" inputmode="numeric" placeholder="25565" />
          </div>
          <div class="field">
            <label for="user">Ник</label>
            <input id="user" type="text" autocomplete="off" placeholder="tester" />
          </div>
          <div class="field">
            <label for="ver">Версия</label>
            <select id="ver">
              <option value="auto">auto</option>
              <option value="26.1.2">26.1.2</option>
              <option value="26.1.1">26.1.1</option>
              <option value="1.21.2">1.21.2</option>
              <option value="1.21.1">1.21.1</option>
              <option value="1.20.4">1.20.4</option>
              <option value="1.20.1">1.20.1</option>
              <option value="1.19.4">1.19.4</option>
              <option value="custom">другая…</option>
            </select>
          </div>
          <div class="field" id="verCustomWrap" style="display:none;grid-column:1 / span 2;">
            <label for="verCustom">Своя версия (например 1.21.1)</label>
            <input id="verCustom" type="text" autocomplete="off" placeholder="1.21.1" />
          </div>
          <div class="field pass" style="grid-column:3 / span 2;">
            <label for="pass">Пароль (для /login)</label>
            <input id="pass" type="password" autocomplete="off" placeholder="сохраняется локально" />
            <button type="button" class="eye" id="passEye" aria-label="Показать/скрыть пароль">👁</button>
          </div>
        </div>

        <div class="actions">
          <div class="left">
            <button type="submit" id="save" class="secondary">Сохранить</button>
            <button type="button" id="connect">Подключиться</button>
            <button type="button" id="disconnect" class="danger">Отключиться</button>
          </div>
          <div class="small" id="cfgHint">—</div>
        </div>
      </form>
      <p class="hint">Пароль сохраняется локально на этом компьютере (в %APPDATA%\\MineBot\\settings.local.json).</p>
    </section>
    <div class="log-wrap">
      <div class="log-head">Лог</div>
      <div id="log"></div>
    </div>
    <div>
      <form class="chat-bar" id="chatform">
        <input id="msg" type="text" autocomplete="off" placeholder="Сообщение в чат Minecraft…" />
        <button type="submit" id="send">Отправить</button>
      </form>
      <p class="hint">Команды с слэшем тоже можно отправить (например <code>/help</code>).</p>
    </div>
    <section class="panel" id="debugPanel" style="display:none;">
      <h2>Дебаг</h2>
      <div class="actions" style="margin-top:0;">
        <div class="left">
          <button type="button" id="debugCopy" class="secondary">Скопировать</button>
          <button type="button" id="debugRefresh" class="secondary">Обновить</button>
          <button type="button" id="debugClose" class="secondary">Закрыть</button>
        </div>
        <div class="small">Отправь этот блок мне — я пойму, что происходит</div>
      </div>
      <pre id="debugText" style="margin:0.6rem 0 0; padding:0.65rem 0.75rem; border:1px solid var(--border); border-radius:8px; background:var(--bg); overflow:auto; max-height:340px;"></pre>
    </section>
  </main>
  <script>
    const BOT_API_DEFAULT = 'http://127.0.0.1:3848'
    const BOT_API_BASE = (localStorage.getItem('botApiBase') || BOT_API_DEFAULT).replace(/\/+$/, '')

    const logEl = document.getElementById('log')
    const pill = document.getElementById('pill')
    const meta = document.getElementById('meta')
    const appverEl = document.getElementById('appver')
    const topUpdateBtn = document.getElementById('topUpdate')
    const topDebugBtn = document.getElementById('topDebug')
    const topRepairBtn = document.getElementById('topRepair')
    const topRestartPanelBtn = document.getElementById('topRestartPanel')
    const topRestartBotBtn = document.getElementById('topRestartBot')
    const debugPanel = document.getElementById('debugPanel')
    const debugText = document.getElementById('debugText')
    const debugCopyBtn = document.getElementById('debugCopy')
    const debugRefreshBtn = document.getElementById('debugRefresh')
    const debugCloseBtn = document.getElementById('debugClose')
    const form = document.getElementById('chatform')
    const input = document.getElementById('msg')
    const btn = document.getElementById('send')
    const cfgForm = document.getElementById('cfgform')
    const hostEl = document.getElementById('host')
    const portEl = document.getElementById('port')
    const userEl = document.getElementById('user')
    const verEl = document.getElementById('ver')
    const verCustomWrap = document.getElementById('verCustomWrap')
    const verCustomEl = document.getElementById('verCustom')
    const passEl = document.getElementById('pass')
    const passEyeBtn = document.getElementById('passEye')
    const saveBtn = document.getElementById('save')
    const connectBtn = document.getElementById('connect')
    const disconnectBtn = document.getElementById('disconnect')
    const cfgHint = document.getElementById('cfgHint')

    const MAX_LINES = 500
    function appendLine(level, message) {
      const div = document.createElement('div')
      div.className = 'line ' + (level || 'info')
      div.textContent = message
      logEl.appendChild(div)
      while (logEl.childElementCount > MAX_LINES) logEl.removeChild(logEl.firstChild)
      logEl.scrollTop = logEl.scrollHeight
    }

    function setHint(text) {
      cfgHint.textContent = text || '—'
    }

    function currentVersionValue() {
      const v = verEl.value
      if (v === 'custom') return verCustomEl.value.trim()
      return v
    }

    function applyConfigToForm(c) {
      hostEl.value = c.host || ''
      portEl.value = c.port != null ? String(c.port) : ''
      userEl.value = c.username || ''
      const ver = (c.version || 'auto').trim()
      const known = new Set(['auto', '26.1.2', '26.1.1', '1.21.2', '1.21.1', '1.20.4', '1.20.1', '1.19.4'])
      if (known.has(ver)) {
        verEl.value = ver
        verCustomWrap.style.display = 'none'
        verCustomEl.value = ''
      } else {
        verEl.value = 'custom'
        verCustomWrap.style.display = ''
        verCustomEl.value = ver === 'auto' ? '' : ver
      }
      passEl.value = ''
      setHint(c.hasPassword ? 'Пароль: задан (не показывается)' : 'Пароль: не задан')
    }

    passEyeBtn.addEventListener('click', () => {
      const show = passEl.type === 'password'
      passEl.type = show ? 'text' : 'password'
      passEyeBtn.style.color = show ? 'var(--text)' : 'var(--muted)'
      passEl.focus()
    })

    function renderStatus(s) {
      const host = s.host != null ? s.host : '—'
      const port = s.port != null ? s.port : '—'
      const user = s.username != null ? s.username : '—'
      const ver = s.version != null ? s.version : '—'
      meta.textContent = host + ':' + port + ' · ' + user + ' · MC ' + ver

      const connecting = Boolean(s.connecting)
      if (s.spawned) {
        pill.className = 'pill ok'
        pill.textContent = 'в мире'
      } else if (connecting) {
        pill.className = 'pill wait'
        pill.textContent = 'подключение…'
      } else if (s.connected) {
        pill.className = 'pill wait'
        pill.textContent = 'вход…'
      } else {
        pill.className = 'pill off'
        pill.textContent = 'нет соединения'
      }

      const running = Boolean(s.running)
      const canChat = Boolean(s.spawned)
      input.disabled = !canChat
      btn.disabled = !canChat
      connectBtn.disabled = Boolean(running || s.connected || connecting)
      disconnectBtn.disabled = !Boolean(running || s.connected || connecting || s.spawned)

      topRestartBotBtn.disabled = !Boolean(running || s.connected || connecting || s.spawned)
    }

    const es = new EventSource(BOT_API_BASE + '/api/stream')
    es.addEventListener('log', (ev) => {
      try {
        const d = JSON.parse(ev.data)
        appendLine(d.level, d.message)
      } catch (_) {}
    })
    es.addEventListener('status', (ev) => {
      try {
        renderStatus(JSON.parse(ev.data))
      } catch (_) {}
    })
    es.onerror = () => appendLine('warn', '[UI] Потеряна связь с BotService, включён опрос статуса')

    async function loadConfig() {
      const c = await fetch(BOT_API_BASE + '/api/config').then(r => r.json())
      applyConfigToForm(c)
    }

    async function pollStatusOnce() {
      try {
        const s = await fetch(BOT_API_BASE + '/api/status', { cache: 'no-store' }).then(r => r.json())
        renderStatus(s)
      } catch (_) {}
    }

    pollStatusOnce()
    setInterval(pollStatusOnce, 1500)
    loadConfig().catch(() => {})

    verEl.addEventListener('change', () => {
      if (verEl.value === 'custom') verCustomWrap.style.display = ''
      else {
        verCustomWrap.style.display = 'none'
        verCustomEl.value = ''
      }
    })

    async function postJson(url, body) {
      const r = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body || {}),
      })
      const j = await r.json().catch(() => ({}))
      if (!r.ok) throw new Error(j.error || ('Ошибка ' + r.status))
      return j
    }

    async function checkUpdate() {
      try {
        // Обновляем именно AppData-код (панель+бот), exe стараемся не трогать часто.
        const r = await fetch('/api/update/check', { cache: 'no-store' })
        const j = await r.json().catch(() => ({}))
        if (r.ok && j && j.ok) {
          if (j.updateAvailable) {
            topUpdateBtn.disabled = false
            topUpdateBtn.textContent = `Обновить код (${j.local} → ${j.remote})`
            topUpdateBtn.dataset.mode = 'app'
            topUpdateBtn.classList.add('success')
            topUpdateBtn.classList.remove('secondary')
            return
          }
          topUpdateBtn.disabled = false
          topUpdateBtn.textContent = 'Проверить обновления'
          topUpdateBtn.dataset.mode = 'none'
          topUpdateBtn.classList.remove('success')
          topUpdateBtn.classList.add('secondary')
          return
        }
        topUpdateBtn.disabled = true
        topUpdateBtn.textContent = 'Проверить обновления'
        topUpdateBtn.dataset.mode = 'none'
        topUpdateBtn.classList.remove('success')
        topUpdateBtn.classList.add('secondary')
      } catch (_) {
        topUpdateBtn.disabled = false
        topUpdateBtn.textContent = 'Проверить обновления'
        topUpdateBtn.dataset.mode = 'none'
        topUpdateBtn.classList.remove('success')
        topUpdateBtn.classList.add('secondary')
      }
    }

    // Проверяем обновления при открытии (без релизов: по версии из GitHub).
    checkUpdate()
    setInterval(checkUpdate, 60_000)

    // Версия панели рядом с названием.
    ;(async () => {
      try {
        const r = await fetch('/api/version', { cache: 'no-store' })
        const j = await r.json().catch(() => ({}))
        const v = j && j.version ? String(j.version) : ''
        appverEl.textContent = v ? ('v' + v) : ''
      } catch (_) {
        appverEl.textContent = ''
      }
    })()

    topUpdateBtn.addEventListener('click', async () => {
      topUpdateBtn.disabled = true
      appendLine('warn', '[UI] Обновление кода (панель+бот) из GitHub...')
      try {
        // Если обновления нет — просто перепроверим.
        if ((topUpdateBtn.dataset.mode || 'none') === 'none') {
          await checkUpdate()
          return
        }
        const r = await fetch('/api/app/update/apply', { method: 'POST' })
        const j = await r.json().catch(() => ({}))
        if (!r.ok || !j.ok) throw new Error(j.message || j.error || ('Ошибка ' + r.status))
        if (j.updated) appendLine('info', '[UI] Обновление установлено. Перезапускаюсь...')
        else appendLine('info', '[UI] Обновление не требуется.')

        // Панель сейчас может быть убита updater-скриптом и поднята заново. Ждём её и перезагружаем окно.
        if (j.updated) {
          const startedAt = Date.now()
          const waitMs = 20000
          const tickMs = 450
          const timer = setInterval(async () => {
            if (Date.now() - startedAt > waitMs) {
              clearInterval(timer)
              appendLine('warn', '[UI] После обновления панель долго не поднимается. Попробуйте F5.')
              topUpdateBtn.disabled = false
              return
            }
            try {
              const rr = await fetch('/home', { cache: 'no-store' })
              if (rr.ok) {
                clearInterval(timer)
                location.reload()
              }
            } catch (_) {}
          }, tickMs)
        }
      } catch (err) {
        appendLine('error', '[UI] ' + String(err && err.message ? err.message : err))
        topUpdateBtn.disabled = false
      } finally {
        // если обновление прошло — панель уйдёт в рестарт, кнопку не трогаем
        setTimeout(checkUpdate, 1500)
      }
    })

    async function loadDebug() {
      const out = { ts: new Date().toISOString() }
      try {
        out.panel = await fetch('/api/debug', { cache: 'no-store' }).then(r => r.json())
      } catch (e) {
        out.panel = { ok: false, error: String(e && e.message ? e.message : e) }
      }
      try {
        const r = await fetch(BOT_API_BASE + '/api/debug', { cache: 'no-store' })
        const ct = (r.headers.get('content-type') || '').toLowerCase()
        if (!r.ok) throw new Error('HTTP ' + r.status)
        if (!ct.includes('application/json')) {
          const text = await r.text().catch(() => '')
          throw new Error('non_json_response: ' + (text ? text.slice(0, 80) : ct || 'unknown'))
        }
        out.botService = await r.json()
      } catch (e) {
        out.botService = { ok: false, error: String(e && e.message ? e.message : e) }
      }
      debugText.textContent = JSON.stringify(out, null, 2)
      return out
    }

    topDebugBtn.addEventListener('click', async () => {
      debugPanel.style.display = ''
      await loadDebug()
      debugText.scrollTop = 0
    })
    debugRefreshBtn.addEventListener('click', () => loadDebug())
    debugCloseBtn.addEventListener('click', () => { debugPanel.style.display = 'none' })
    debugCopyBtn.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(debugText.textContent || '')
        appendLine('info', '[UI] Дебаг скопирован в буфер')
      } catch (e) {
        appendLine('warn', '[UI] Не смог скопировать (права браузера). Просто выдели и скопируй вручную.')
      }
    })

    topRepairBtn.addEventListener('click', async () => {
      topRepairBtn.disabled = true
      appendLine('warn', '[UI] Починка: освобождаю порты и перезапускаю сервисы...')
      try {
        const r = await fetch('/api/repair', { method: 'POST' })
        const j = await r.json().catch(() => ({}))
        if (!r.ok || !j.ok) throw new Error(j.error || ('Ошибка ' + r.status))
        appendLine('info', '[UI] Ок. Перезапускаю…')
        // Repair инициирует полный рестарт runner'а: панель и botService могут на секунды пропасть.
        // Автоматически ждём, пока панель снова поднимется, затем перезагружаем окно.
        const startedAt = Date.now()
        const waitMs = 20000
        const tickMs = 450
        const timer = setInterval(async () => {
          if (Date.now() - startedAt > waitMs) {
            clearInterval(timer)
            appendLine('warn', '[UI] После починки панель долго не поднимается. Попробуйте F5.')
            topRepairBtn.disabled = false
            return
          }
          try {
            const rr = await fetch('/home', { cache: 'no-store' })
            if (rr.ok) {
              clearInterval(timer)
              location.reload()
            }
          } catch (_) {
            // пока панель не поднялась — это нормально
          }
        }, tickMs)
      } catch (err) {
        appendLine('error', '[UI] ' + String(err && err.message ? err.message : err))
        topRepairBtn.disabled = false
      }
    })

    cfgForm.addEventListener('submit', async (e) => {
      e.preventDefault()
      saveBtn.disabled = true
      try {
        const patch = {
          host: hostEl.value.trim(),
          port: portEl.value,
          username: userEl.value.trim(),
          version: currentVersionValue(),
        }
        if (passEl.value) patch.password = passEl.value
        const j = await postJson(BOT_API_BASE + '/api/config', patch)
        applyConfigToForm(j.config || {})
        appendLine('info', '[UI] Настройки сохранены')
      } catch (err) {
        appendLine('error', '[UI] ' + String(err && err.message ? err.message : err))
      } finally {
        saveBtn.disabled = false
      }
    })

    connectBtn.addEventListener('click', async () => {
      connectBtn.disabled = true
      try {
        await cfgForm.dispatchEvent(new Event('submit', { cancelable: true }))
        await postJson(BOT_API_BASE + '/api/connect', {})
      } catch (err) {
        appendLine('error', '[UI] ' + String(err && err.message ? err.message : err))
      } finally {
        connectBtn.disabled = false
      }
    })

    disconnectBtn.addEventListener('click', async () => {
      disconnectBtn.disabled = true
      try {
        await postJson(BOT_API_BASE + '/api/disconnect', {})
      } catch (err) {
        appendLine('error', '[UI] ' + String(err && err.message ? err.message : err))
      } finally {
        disconnectBtn.disabled = false
      }
    })

    topRestartBotBtn.addEventListener('click', async () => {
      topRestartBotBtn.disabled = true
      try {
        await postJson(BOT_API_BASE + '/api/restart', {})
      } catch (err) {
        appendLine('error', '[UI] ' + String(err && err.message ? err.message : err))
      } finally {
        topRestartBotBtn.disabled = false
      }
    })

    topRestartPanelBtn.addEventListener('click', async () => {
      topRestartPanelBtn.disabled = true
      appendLine('warn', '[UI] Перезапуск панели...')
      try {
        await postJson('/api/panel/restart', {})
        // Панель сейчас упадёт и поднимется заново. Ждём её и перезагружаем окно автоматически.
        const startedAt = Date.now()
        const waitMs = 15000
        const tickMs = 400
        const timer = setInterval(async () => {
          if (Date.now() - startedAt > waitMs) {
            clearInterval(timer)
            appendLine('warn', '[UI] Панель долго не поднимается. Попробуйте F5.')
            topRestartPanelBtn.disabled = false
            return
          }
          try {
            const r = await fetch('/home', { cache: 'no-store' })
            if (r.ok) {
              clearInterval(timer)
              location.reload()
            }
          } catch (_) {
            // пока панель не поднялась — это нормально
          }
        }, tickMs)
      } catch (err) {
        appendLine('error', '[UI] ' + String(err && err.message ? err.message : err))
        topRestartPanelBtn.disabled = false
      }
    })

    form.addEventListener('submit', async (e) => {
      e.preventDefault()
      const text = input.value.trim()
      if (!text) return
      btn.disabled = true
      try {
        const r = await fetch(BOT_API_BASE + '/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text }),
        })
        const j = await r.json().catch(() => ({}))
        if (!r.ok) appendLine('error', j.error || ('Ошибка ' + r.status))
        else input.value = ''
      } catch (err) {
        appendLine('error', String(err))
      } finally {
        btn.disabled = false
        input.focus()
      }
    })
  </script>
</body>
</html>
