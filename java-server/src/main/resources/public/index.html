<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>MineBot</title>
  </head>
  <body>
    <h1>MineBot (Java)</h1>
    <p>Сервер жив. Дальше сюда перенесём панель и управление ботом.</p>
    <pre id="status">loading...</pre>
    <script>
      ;(async () => {
        try {
          const j = await fetch('/api/status', { cache: 'no-store' }).then(r => r.json())
          document.getElementById('status').textContent = JSON.stringify(j, null, 2)
        } catch (e) {
          document.getElementById('status').textContent = String(e && e.message ? e.message : e)
        }
      })()
    </script>
  </body>
</html>
